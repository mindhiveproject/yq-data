# Conda environment for regenerating the golden-value fixtures.
#
#   conda env create -f tests/unit/golden/environment.yml
#   conda activate yq-golden
#   python tests/unit/golden/generate.py
#
# numpy/scipy are the conformance references. neurokit2 (PPG/HRV) and yasa
# (EEG band power) are the field-standard pipelines; they are pinned exactly
# because their algorithms feed fixture values directly. Octave runs the
# ppg-beats MATLAB reference detectors for the cardiac fixtures.
name: yq-golden
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy=2.1
  - scipy=1.14
  - neurokit2=0.2.13
  - yasa=0.7.0
  - octave>=7
